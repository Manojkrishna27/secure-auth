services:
  backend:
    build:
      context: ./secure-auth-backend

    container_name: secure-auth-backend

    env_file:
      - ./secure-auth-backend/.env

    environment:
      DB_HOST: mysql
      ALLOWED_ORIGINS: http://localhost:8080
      RATE_LIMIT_STORAGE: redis://redis:6379

    ports:
      - "8081:5000"

    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    restart: unless-stopped

    networks:
      - secure-auth

  frontend:
    build:
      context: ./secure-auth-frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8081}

    container_name: secure-auth-frontend

    ports:
      - "8080:80"

    depends_on:
      backend:
        condition: service_healthy

    restart: unless-stopped

    networks:
      - secure-auth

  mysql:
    image: mysql:8.0

    container_name: secure-auth-mysql

    command: ["--default-authentication-plugin=mysql_native_password"]

    restart: unless-stopped

    environment:
      MYSQL_DATABASE: secure_auth
      MYSQL_ROOT_PASSWORD: root123

    # MySQL is only accessible within the Docker network (not exposed to host)
    expose:
      - "3306"

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

    volumes:
      - secureauth-mysql-data:/var/lib/mysql

    networks:
      - secure-auth

  redis:
    image: redis:7-alpine

    container_name: secure-auth-redis

    restart: unless-stopped

    expose:
      - "6379"

    networks:
      - secure-auth

volumes:
  secureauth-mysql-data:

networks:
  secure-auth:
    driver: bridge